<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Open in Mail</title></head>
<body>
  <p>Opening email in Mail…</p>
  <script>
    // Read the ID from the part after # (this part is never sent to GitHub)
    let id = decodeURIComponent(location.hash.slice(1));

    if (id) {
      id = id.replace(/[<>]/g, "");
      const mailLink = "message://%3C" + encodeURIComponent(id) + "%3E";
      location.href = mailLink;
      document.body.innerHTML += '<p><a href="' + mailLink + '">Click here if Mail did not open</a></p>';
    } else {
      document.body.innerHTML = "<p>No email ID in this link.</p>";
    }
  </script>
</body>
</html>
